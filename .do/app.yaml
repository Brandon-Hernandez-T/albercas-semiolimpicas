# Dominio: albercas-ixtapaluca.xyz
# SECRET_KEY: definir en App Platform → Settings → Environment Variables (tipo Secret).
# Durante el primer deploy, agregar también <app>.ondigitalocean.app en ALLOWED_HOSTS desde el panel de DO.
name: albercas-semiolimpicas
region: sfo
services:
  - name: web
    github:
      repo: Brandon-Hernandez-T/albercas-semiolimpicas
      branch: master
      deploy_on_push: true
    source_dir: /
    environment_slug: python
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /health/
    build_command: pip install -r requirements.txt && python manage.py collectstatic --noinput
    run_command: bash start.sh
    envs:
      - key: DEBUG
        value: "False"
        scope: RUN_AND_BUILD_TIME
      - key: SECRET_KEY
        value: ${SECRET_KEY}
        type: SECRET
        scope: RUN_AND_BUILD_TIME
      - key: ALLOWED_HOSTS
        value: albercas-ixtapaluca.xyz,www.albercas-ixtapaluca.xyz
      - key: CSRF_TRUSTED_ORIGINS
        value: https://albercas-ixtapaluca.xyz,https://www.albercas-ixtapaluca.xyz
      - key: DB_NAME
        value: ${db.DATABASE}
      - key: DB_USER
        value: ${db.USERNAME}
      - key: DB_PASSWORD
        value: ${db.PASSWORD}
        type: SECRET
      - key: DB_HOST
        value: ${db.HOSTNAME}
      - key: DB_PORT
        value: ${db.PORT}
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: LOG_LEVEL
        value: INFO
      - key: GUNICORN_WORKERS
        value: "2"
    routes:
      - path: /
databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    run_command: python manage.py migrate --noinput

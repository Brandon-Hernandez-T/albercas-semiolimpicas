<div id="suggestions-list" class="suggestions" role="listbox" aria-label="Coincidencias de clientes">
  {% if suggestions %}
    {% for item in suggestions %}
      <button
        type="button"
        class="suggestion-item"
        role="option"
        data-access-number="{{ item.access_number }}"
        data-client-name="{{ item.name }}"
        data-client-plan="{{ item.plan_name }}"
        data-classes-label="{{ item.classes_label }}"
      >
        <span class="suggestion-number">{{ item.access_number }}</span>
        <span class="suggestion-name">{{ item.name }}</span>
        <span class="suggestion-plan">{{ item.plan_name }} · {{ item.classes_label }}</span>
      </button>
    {% endfor %}
  {% elif query|length >= 2 %}
    <p class="suggestions-empty">Sin coincidencias para «{{ query }}».</p>
  {% endif %}
</div>
